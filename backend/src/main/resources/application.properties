spring.application.name=JobTracker_Backend
server.port=${PORT:10000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=jobs_tracker_v1

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refreshExpirationMs=2592000000

frontend.url=${FRONTEND_URL}
frontend.urls=${FRONTEND_URLS}

spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=60000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.security.enabled=false

spring.cache.type=caffeine

# ==================== Redis (rate limiting) ====================
# The connection is built in config/RedisConfig from these environment variables,
# the same ones the ingestion scripts already use:
#   REDIS_URL   preferred, e.g. redis://default:<password>@<host>:<port>
#   REDIS_HOST / REDIS_PORT / REDIS_PASSWORD   fallback when REDIS_URL is unset
# With none of them set it points at localhost:6379; if nothing is listening the
# rate limiter simply fails open.

# ==================== Rate limiting ====================
# Fixed-window counters in Redis, keyed by client IP. Fails open if Redis is unreachable.
app.ratelimit.enabled=${RATELIMIT_ENABLED:true}
app.ratelimit.default-limit=${RATELIMIT_DEFAULT_LIMIT:120}
app.ratelimit.default-window-seconds=${RATELIMIT_DEFAULT_WINDOW:60}
app.ratelimit.auth-limit=${RATELIMIT_AUTH_LIMIT:10}
app.ratelimit.auth-window-seconds=${RATELIMIT_AUTH_WINDOW:300}
app.ratelimit.auth-paths=/api/auth/login,/api/auth/register,/api/auth/refresh
app.ratelimit.exempt-paths=/actuator/health,/api/public/health

# ==================== Browser-only guard ====================
# Rejects requests whose User-Agent looks like a scripted client, or whose
# Origin/Referer does not match a configured frontend URL.
# Set BROWSER_GUARD_ENABLED=false to disable (e.g. when testing with curl/Postman).
app.browser-guard.enabled=${BROWSER_GUARD_ENABLED:true}
app.browser-guard.protected-prefixes=/api/jobs,/api/companies,/api/user,/api/users,/api/preferences
app.browser-guard.exempt-paths=/actuator/health,/api/public/health
app.browser-guard.blocked-agent-tokens=curl,wget,python-requests,python-urllib,scrapy,httpie,go-http-client,java/,apache-httpclient,libwww-perl,okhttp,axios,node-fetch,got,postmanruntime,insomnia,restsharp,guzzle,aiohttp,httpx,puppeteer,headlesschrome,phantomjs

# ==================== Pagination ====================
app.pagination.max-size=${PAGINATION_MAX_SIZE:50}

# ==================== Response encryption ====================
# AES-256-GCM. Key must be 32 raw bytes, base64-encoded.
# Generate: openssl rand -base64 32
# The frontend must hold the same value in VITE_RESPONSE_ENCRYPTION_KEY.
app.crypto.enabled=${RESPONSE_ENCRYPTION_ENABLED:true}
app.crypto.key=${RESPONSE_ENCRYPTION_KEY:}
